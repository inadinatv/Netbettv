<body>
<div class="app-container">
<header class="site-header"><div class="topbar">
<div class="brand" aria-label="Player TV ana sayfa"><div class="brand-mark" aria-hidden="true"><span>TV</span></div><div class="brand-copy"><strong>PLAYER TV</strong><span>Canlı yayın merkezi</span></div></div>
<div class="live-badge">Yayınlar aktif</div>
</div></header>
<main>
<section class="hero" aria-labelledby="page-title"><div class="hero-content"><div class="eyebrow">Yeni nesil yayın deneyimi</div></div><div class="hero-stats" aria-label="Yayın istatistikleri"><div class="stat-card"><strong id="totalChannels">0</strong><span>Toplam kanal</span></div><div class="stat-card"><strong id="totalCategories">0</strong><span>Kategori</span></div></div></section>

<section class="toolbar" aria-label="Kanal araçları"><nav class="category-tabs" id="categoryTabs" aria-label="Kategori filtreleri"><button class="tab-button active" type="button" data-filter="all">Tümü</button></nav><label class="search-box" for="channelSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="channelSearch" type="search" placeholder="Kanal ara..." autocomplete="off"></label></section>

<!-- GUNUN_MACLARI_BASLANGIC -->
<section class="matches-panel" aria-labelledby="todayMatchesTitle">
  <div class="section-heading">
    <h3 id="todayMatchesTitle">Günün Maçları</h3>
    <span>Canlı takip</span>
  </div>
  <div id="matchList" class="match-list" aria-live="polite"></div>
</section>
<!-- GUNUN_MACLARI_BITIS -->

<!-- PUAN_DURUMU_BASLANGIC -->
<section class="toolbar" style="margin-bottom: 20px; display: block;">
    <button id="standingsToggle" type="button" class="standings-toggle">📊 Puan Durumu</button>
</section>
<div id="standingsModal" class="standings-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="standingsModalTitle">
    <div class="standings-modal-backdrop" data-close-standings="true"></div>
    <div class="standings-modal-panel">
        <div class="standings-modal-header">
            <h3 id="standingsModalTitle">📊 Puan Durumu</h3>
            <button id="standingsClose" type="button" class="standings-close" aria-label="Pencereyi kapat">✕</button>
        </div>
        <iframe frameborder="0" scrolling="no" width="100%" height="680" src="https://fixbettv84.com/puan.html" title="Puan durumu" style="border: none; background: transparent;" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
</div>
<!-- PUAN_DURUMU_BITIS -->

<div id="videoModal" class="video-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="videoTitle">
    <div class="video-modal-backdrop" data-close-video="true"></div>
    <div class="video-shell">
        <div class="video-header">
            <strong id="videoTitle">Canlı Yayın</strong>
            <button id="videoClose" type="button" class="video-close" aria-label="Videoyu kapat">✕</button>
        </div>
        <div class="video-viewport">
            <div id="videoLoader" class="video-loader" aria-live="polite">
                <div class="spinner" aria-hidden="true"></div>
                <span>Yayın açılıyor...</span>
            </div>
            <iframe id="videoFrame" title="Canlı yayın" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
    </div>
</div>

<section id="contentGrid" class="content-grid" aria-live="polite"></section>
</main>
<footer class="footer"><p class="footer-line"><span class="live-dot" aria-hidden="true"></span><strong>PLAYER TV</strong> · Kesintisiz yayın deneyimi</p><p>© 2026 · Tüm yayınlar test amaçlıdır · 7/24</p></footer>
</div>

<script>
// BASE_URL_START
const BASE_URL="https://fixbettv84.com/";
// BASE_URL_END

const categories=[
{title:"BEIN SPORTS",icon:"▰",channels:[{id:"zirve",name:"Bein Sports 1"},{id:"b2",name:"Bein Sports 2"},{id:"b3",name:"Bein Sports 3"},{id:"b4",name:"Bein Sports 4"},{id:"b5",name:"Bein Sports 5"},{id:"bm1",name:"Bein Sports Max 1"},{id:"bm2",name:"Bein Sports Max 2"},{id:"bh",name:"Bein Sports Haber"}]},
{title:"S SPORT",icon:"✦",channels:[{id:"ss",name:"S Sport"},{id:"ss2",name:"S Sport 2"}]},
{title:"TİVİBU SPOR",icon:"◉",channels:[{id:"t0",name:"Tivibu Spor (Genel)"},{id:"t1",name:"Tivibu Spor 1"},{id:"t2",name:"Tivibu Spor 2"},{id:"t3",name:"Tivibu Spor 3"},{id:"t4",name:"Tivibu Spor 4"}]},
{title:"SMART SPOR",icon:"✧",channels:[{id:"smarts",name:"Akıllı Spor"},{id:"sms2",name:"Smart Spor 2"}]},
{title:"TRT SPOR",icon:"▣",channels:[{id:"trtspor",name:"Trt Spor"},{id:"trtspor2",name:"Trt Spor Yıldız"},{id:"trt1",name:"Trt 1"}]},
{title:"GENEL KANALLAR",icon:"◇",channels:[{id:"atv",name:"Atv"},{id:"tv8",name:"Tv 8"},{id:"tv85",name:"Tv 8,5"}]},
{title:"TABİİ SPOR",icon:"◈",channels:[{id:"ex7",name:"Tabii Spor"},{id:"ex1",name:"Tabii Spor 1"},{id:"ex2",name:"Tabii Spor 2"},{id:"ex3",name:"Tabii Spor 3"},{id:"ex4",name:"Tabii Spor 4"},{id:"ex5",name:"Tabii Spor 5"},{id:"ex6",name:"Tabii Spor 6"}]},
{title:"DİĞER SPOR",icon:"✺",channels:[{id:"as",name:"Bir Spor"},{id:"eu1",name:"Euro Sport 1"},{id:"eu2",name:"Euro Sport 2"}]}
];
const todayMatches=[
    {title:"Galatasaray - Fenerbahçe",time:"20:00",channel:"S Sport",id:"ss"},
    {title:"Başakşehir - Beşiktaş",time:"18:30",channel:"Tivibu Spor 1",id:"t1"},
    {title:"Trabzonspor - Adana Demirspor",time:"19:00",channel:"TRT Spor",id:"trtspor"},
    {title:"Bursaspor - Kocaelispor",time:"21:00",channel:"Bein Sports 2",id:"b2"},
    {title:"Göztepe - Samsunspor",time:"17:15",channel:"Smart Spor",id:"smarts"}
];
const contentGrid=document.getElementById("contentGrid"),categoryTabs=document.getElementById("categoryTabs"),searchInput=document.getElementById("channelSearch"),totalChannelsElement=document.getElementById("totalChannels"),totalCategoriesElement=document.getElementById("totalCategories");let activeFilter="all";
const arrowIcon='<svg class="channel-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"></path><path d="m13 6 6 6-6 6"></path></svg>';
const normalize=value=>value.toLocaleLowerCase("tr-TR");
const fallbackVideoUrl='https://www.youtube.com/embed/ScMzIvxBSi4?autoplay=1&rel=0';
let videoFallbackTimer=null;
const standingsToggle=document.getElementById("standingsToggle");
const standingsModal=document.getElementById("standingsModal");
const standingsClose=document.getElementById("standingsClose");
const videoModal=document.getElementById("videoModal");
const videoFrame=document.getElementById("videoFrame");
const videoClose=document.getElementById("videoClose");
const videoLoader=document.getElementById("videoLoader");

function renderMatches(){
    const target=document.getElementById("matchList");
    if(!target){return;}
    target.innerHTML="";
    todayMatches.forEach((match,index)=>{
        const button=document.createElement("button");
        button.type="button";
        button.className="match-item";
        button.setAttribute("aria-label",match.title+" maçını aç");
        button.innerHTML='<span class="match-badge">'+(index+1)+'</span><span class="match-copy"><strong>'+match.title+'</strong><span>'+match.time+' • '+match.channel+'</span></span><span class="match-arrow">›</span>';
        button.addEventListener("click",()=>openMatchById(match.id));
        target.appendChild(button);
    });
}

function openMatchById(channelId){
    if(!channelId){return;}
    const url=BASE_URL+"channel?id="+encodeURIComponent(channelId);
    if(videoModal&&videoFrame){
        videoFrame.src=url;
        videoFrame.setAttribute("allow","accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen");
        videoFrame.setAttribute("referrerpolicy","no-referrer-when-downgrade");
        videoLoader&&videoLoader.classList.remove("hidden");
        videoModal.classList.add("visible");
        videoModal.setAttribute("aria-hidden","false");
        document.body.style.overflow="hidden";
        clearTimeout(videoFallbackTimer);
        videoFallbackTimer=setTimeout(()=>{
            if(videoFrame && videoFrame.src && videoFrame.src.includes('fixbettv84.com/channel')){
                videoFrame.src=fallbackVideoUrl;
                videoLoader&&videoLoader.classList.add("hidden");
            }
        },9000);
        return;
    }
    window.location.assign(url);
}

function closeVideoModal(){
    if(!videoModal||!videoFrame){return;}
    clearTimeout(videoFallbackTimer);
    videoFrame.src="about:blank";
    videoModal.classList.remove("visible");
    videoModal.setAttribute("aria-hidden","true");
    document.body.style.overflow="";
    videoLoader&&videoLoader.classList.remove("hidden");
}

function openStandingsModal(){
    if(!standingsModal){return;}
    standingsModal.classList.add("visible");
    standingsModal.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
}

function closeStandingsModal(){
    if(!standingsModal){return;}
    standingsModal.classList.remove("visible");
    standingsModal.setAttribute("aria-hidden","true");
    document.body.style.overflow="";
}

function renderTabs(){categories.forEach(category=>{const button=document.createElement("button");button.type="button";button.className="tab-button";button.dataset.filter=category.title;button.textContent=category.title;button.addEventListener("click",()=>{activeFilter=category.title;document.querySelectorAll(".tab-button").forEach(tab=>tab.classList.toggle("active",tab===button));renderCategories()});categoryTabs.appendChild(button)})}
function renderCategories(){const query=normalize(searchInput.value.trim());contentGrid.innerHTML="";let visibleCount=0;categories.forEach((category,categoryIndex)=>{if(activeFilter!=="all"&&activeFilter!==category.title)return;const matchingChannels=category.channels.filter(channel=>normalize(channel.name).includes(query));if(!matchingChannels.length)return;visibleCount+=matchingChannels.length;const categoryElement=document.createElement("article");categoryElement.className="category";categoryElement.style.animationDelay=Math.min(categoryIndex*55,360)+"ms";const header=document.createElement("header");header.className="category-header";header.innerHTML='<span class="category-icon" aria-hidden="true">'+category.icon+'</span><div class="category-heading"><div class="category-title">'+category.title+'</div><div class="category-subtitle">Canlı yayın kanalları</div></div><span class="category-count">'+matchingChannels.length+' kanal</span>';categoryElement.appendChild(header);const list=document.createElement("ul");list.className="channel-list";matchingChannels.forEach((channel,channelIndex)=>{const item=document.createElement("li");item.className="channel-item";const link=document.createElement("a");link.className="channel-link";link.href=BASE_URL+"channel?id="+encodeURIComponent(channel.id);link.target="_self";link.rel="noopener";link.setAttribute("aria-label",channel.name+" kanalını aç");link.addEventListener("click",event=>{event.preventDefault();openMatchById(channel.id);});link.innerHTML='<span class="channel-number">'+String(channelIndex+1).padStart(2,"0")+'</span><span class="channel-live" aria-label="Canlı"></span><span class="channel-name"></span><span class="channel-meta">HD</span>'+arrowIcon;link.querySelector(".channel-name").textContent=channel.name;item.appendChild(link);list.appendChild(item)});categoryElement.appendChild(list);contentGrid.appendChild(categoryElement)});if(!visibleCount)contentGrid.innerHTML='<div class="empty-state"><strong>Kanal bulunamadı</strong><span>Arama kelimenizi veya kategori filtresini değiştirerek tekrar deneyin.</span></div>'}
totalChannelsElement.textContent=categories.reduce((sum,category)=>sum+category.channels.length,0);totalCategoriesElement.textContent=categories.length;renderTabs();renderCategories();searchInput.addEventListener("input",renderCategories);

if(standingsToggle){standingsToggle.addEventListener("click",openStandingsModal);}
if(standingsClose){standingsClose.addEventListener("click",closeStandingsModal);}
if(standingsModal){standingsModal.addEventListener("click",event=>{if(event.target && event.target.hasAttribute("data-close-standings")){closeStandingsModal();}});}
if(videoClose){videoClose.addEventListener("click",closeVideoModal);}
if(videoModal){videoModal.addEventListener("click",event=>{if(event.target && event.target.hasAttribute("data-close-video")){closeVideoModal();}});}
if(videoFrame){videoFrame.addEventListener("load",()=>{videoFrame.dataset.loaded="1";if(videoLoader){videoLoader.classList.add("hidden");}});}
renderMatches();
document.addEventListener("keydown",event=>{if(event.key==="Escape"){if(standingsModal&&standingsModal.classList.contains("visible")){closeStandingsModal();}if(videoModal&&videoModal.classList.contains("visible")){closeVideoModal();}}});

// iframe reklam engelleme - bet afişlerini gizle
function hideIframeAds(){
    const iframes=document.querySelectorAll('iframe');
    iframes.forEach(iframe=>{
        const src=iframe.src.toLowerCase();
        if(src.includes('bet')||src.includes('reklam')||src.includes('ad')){
            iframe.style.display='none';
        }
    });
}
setInterval(hideIframeAds,500);
hideIframeAds();
</script>
</body>
</html>
