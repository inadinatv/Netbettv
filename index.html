<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netbettv - Canlı Maç İzle</title>
    <style>
        :root {
            --primary-color: #00ff88;
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --text-color: #ffffff;
            --neon-glow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 30px #00ff88;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Neon Logo Efekti */
        .logo-container {
            padding: 20px;
            background: linear-gradient(180deg, #1a1a24 0%, #0f0f13 100%);
            border-bottom: 2px solid var(--primary-color);
        }

        h1.logo {
            font-size: 2.5rem;
            margin: 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--primary-color),
                0 0 40px var(--primary-color),
                0 0 80px var(--primary-color);
            animation: neon-pulse 1.5s infinite alternate;
        }

        @keyframes neon-pulse {
            from {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 20px var(--primary-color),
                    0 0 40px var(--primary-color);
            }
            to {
                text-shadow: 
                    0 0 10px #fff,
                    0 0 20px #fff,
                    0 0 30px var(--primary-color),
                    0 0 60px var(--primary-color),
                    0 0 90px var(--primary-color);
            }
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 5px var(--primary-color);
        }

        .btn:hover {
            background-color: var(--primary-color);
            color: #000;
            box-shadow: 0 0 20px var(--primary-color);
            transform: translateY(-3px);
        }

        .channel-list, .match-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .channel-item, .match-item {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .channel-item:hover, .match-item:hover {
            transform: scale(1.05);
            background-color: #252530;
            border-color: var(--primary-color);
        }

        .match-time {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 5px;
        }

        .section-title {
            color: var(--primary-color);
            margin-top: 40px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        /* Iframe Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }

        .close-btn:hover {
            color: var(--primary-color);
        }

        /* Reklam Gizleme (Iframe içi) */
        .ad-blocker-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Tıklamaları engellemez ama görseli örter */
            z-index: 10;
            display: none; /* JS ile kontrol edilecek */
        }
        
        /* Puan Durumu Tablosu */
        #standings-container {
            display: none;
            margin-top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
        }
        
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        
        th {
            color: var(--primary-color);
        }

        .loading {
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <h1 class="logo">NETBETTV</h1>
    </div>

    <div class="container">
        <!-- Butonlar -->
        <div class="btn-group">
            <button class="btn" onclick="toggleSection('main-channels')">📺 Ana Kanallar</button>
            <button class="btn" onclick="loadTodaysMatches()">📅 Günün Maçları</button>
            <button class="btn" onclick="toggleStandings()">📊 Puan Durumu</button>
        </div>

        <!-- Ana Kanallar Bölümü -->
        <div id="main-channels" class="section-content" style="display:none;">
            <h2 class="section-title">Popüler Kanallar</h2>
            <div class="channel-list" id="channel-grid">
                <!-- Kanallar JS ile doldurulacak -->
            </div>
        </div>

        <!-- Günün Maçları Bölümü -->
        <div id="matches-section" class="section-content" style="display:none;">
            <h2 class="section-title">Bugünkü Maçlar & Saatleri</h2>
            <div id="matches-loading" class="loading">Maçlar yükleniyor...</div>
            <div class="match-list" id="match-grid"></div>
        </div>

        <!-- Puan Durumu Bölümü -->
        <div id="standings-container">
            <h2 class="section-title">Süper Lig Puan Durumu</h2>
            <div id="standings-loading" class="loading">Puan durumu yükleniyor...</div>
            <table id="standings-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Takım</th>
                        <th>O</th>
                        <th>G</th>
                        <th>B</th>
                        <th>M</th>
                        <th>P</th>
                    </tr>
                </thead>
                <tbody id="standings-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Iframe Modal -->
    <div id="player-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closePlayer()">&times; Kapat</button>
            <iframe id="player-frame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Kanal Listesi (Ana Kanallar)
        const channels = [
            { name: "BeIN Sports 1", url: "https://www.fixbettv84.com/bein-sports-1-canli-izle" },
            { name: "BeIN Sports 2", url: "https://www.fixbettv84.com/bein-sports-2-canli-izle" },
            { name: "BeIN Sports 3", url: "https://www.fixbettv84.com/bein-sports-3-canli-izle" },
            { name: "BeIN Sports 4K", url: "https://www.fixbettv84.com/bein-sports-4k-canli-izle" },
            { name: "S Sport 1", url: "https://www.fixbettv84.com/s-sport-1-canli-izle" },
            { name: "S Sport 2", url: "https://www.fixbettv84.com/s-sport-2-canli-izle" },
            { name: "A Spor", url: "https://www.fixbettv84.com/a-spor-canli-izle" },
            { name: "TRT Spor", url: "https://www.fixbettv84.com/trt-spor-canli-izle" },
            { name: "Fanatik", url: "https://www.fixbettv84.com/fanatik-tv-canli-izle" },
            { name: "TJK TV", url: "https://www.fixbettv84.com/tjk-tv-canli-izle" }
        ];

        // Sayfa Yüklendiğinde Ana Kanalları Getir
        window.onload = function() {
            const channelGrid = document.getElementById('channel-grid');
            channelGrid.innerHTML = '';
            
            channels.forEach(ch => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerHTML = `<strong>${ch.name}</strong>`;
                div.onclick = () => openPlayer(ch.url);
                channelGrid.appendChild(div);
            });
        };

        // Bölüm Aç/Kapa
        function toggleSection(id) {
            const el = document.getElementById(id);
            const isVisible = el.style.display === 'block';
            // Diğerlerini kapat
            document.querySelectorAll('.section-content').forEach(d => d.style.display = 'none');
            document.getElementById('standings-container').style.display = 'none';
            
            if (!isVisible) {
                el.style.display = 'block';
            }
        }

        // Puan Durumu Toggle
        function toggleStandings() {
            const container = document.getElementById('standings-container');
            const isVisible = container.style.display === 'block';
            
            document.querySelectorAll('.section-content').forEach(d => d.style.display = 'none');
            
            if (!isVisible) {
                container.style.display = 'block';
                fetchStandings();
            } else {
                container.style.display = 'none';
            }
        }

        // Puan Durumunu Çek (API veya Mock Data - Burada örnek veri kullanıyoruz çünkü CORS sorunu olabilir)
        async function fetchStandings() {
            const tbody = document.getElementById('standings-body');
            const loading = document.getElementById('standings-loading');
            
            // Gerçek API yoksa örnek veri gösterelim (Kullanıcı isteğine göre burası güncellenebilir)
            // Not: Fixbettv84'den puan durumunu çekmek için özel bir scraper gerekir, şimdilik statik yapıyoruz.
            // İsterseniz bir API endpoint'i ekleyebiliriz.
            
            loading.style.display = 'none';
            tbody.innerHTML = '';
            
            // Örnek Veri (Gerçek veriyi çekmek için backend gerekir, frontend CORS hatası verir)
            const mockData = [
                { rank: 1, team: "Galatasaray", p: 3, w: 3, d: 0, l: 0, pts: 9 },
                { rank: 2, team: "Fenerbahçe", p: 3, w: 3, d: 0, l: 0, pts: 9 },
                { rank: 3, team: "Beşiktaş", p: 3, w: 2, d: 1, l: 0, pts: 7 },
                { rank: 4, team: "Trabzonspor", p: 3, w: 2, d: 0, l: 1, pts: 6 },
                { rank: 5, team: "Başakşehir", p: 3, w: 1, d: 2, l: 0, pts: 5 },
                { rank: 6, team: "Samsunspor", p: 3, w: 1, d: 1, l: 1, pts: 4 },
                { rank: 7, team: "Göztepe", p: 3, w: 1, d: 1, l: 1, pts: 4 },
                { rank: 8, team: "Kasımpaşa", p: 3, w: 1, d: 0, l: 2, pts: 3 },
                { rank: 9, team: "Rizespor", p: 3, w: 1, d: 0, l: 2, pts: 3 },
                { rank: 10, team: "Konyaspor", p: 3, w: 0, d: 2, l: 1, pts: 2 }
            ];

            mockData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.rank}</td>
                    <td><strong>${row.team}</strong></td>
                    <td>${row.p}</td>
                    <td>${row.w}</td>
                    <td>${row.d}</td>
                    <td>${row.l}</td>
                    <td style="color:var(--primary-color); font-weight:bold;">${row.pts}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Günün Maçlarını Çek ve Listele
        async function loadTodaysMatches() {
            toggleSection('matches-section');
            const matchGrid = document.getElementById('match-grid');
            const loading = document.getElementById('matches-loading');
            
            matchGrid.innerHTML = '';
            loading.style.display = 'block';

            try {
                // Fixbettv84 ana sayfasından maçları çekme simülasyonu
                // Gerçek senaryoda bir proxy veya backend gerekir. 
                // Burada kullanıcıya doğrudan linkleri sunuyoruz.
                
                // NOT: Frontend'den direkt fetch CORS hatası vereceği için, 
                // bu örnekte manuel olarak tanımlanmış bugünün maçlarını gösteriyoruz.
                // Botunuzun çektiği veriyi buraya JSON olarak aktarabilirsiniz.
                
                setTimeout(() => {
                    loading.style.display = 'none';
                    
                    // Örnek Maç Verisi (Botunuzdan gelen veri buraya gelecek)
                    const todayMatches = [
                        { home: "Galatasaray", away: "Fenerbahçe", time: "21:00", channelUrl: "https://www.fixbettv84.com/bein-sports-1-canli-izle" },
                        { home: "Beşiktaş", away: "Trabzonspor", time: "19:30", channelUrl: "https://www.fixbettv84.com/bein-sports-2-canli-izle" },
                        { home: "Hazırlık Maçı", away: "Liverpool - Milan", time: "22:00", channelUrl: "https://www.fixbettv84.com/s-sport-1-canli-izle" },
                        { home: "İngiltere U21", away: "Almanya U21", time: "18:45", channelUrl: "https://www.fixbettv84.com/a-spor-canli-izle" }
                    ];

                    if(todayMatches.length === 0) {
                        matchGrid.innerHTML = '<p>Bugün maç bulunamadı.</p>';
                        return;
                    }

                    todayMatches.forEach(match => {
                        const div = document.createElement('div');
                        div.className = 'match-item';
                        div.innerHTML = `
                            <div style="font-weight:bold; font-size:1.1em;">${match.home} vs ${match.away}</div>
                            <div class="match-time">⏰ Saat: ${match.time}</div>
                            <div style="font-size:0.8em; color:var(--primary-color); margin-top:5px;">İzlemek için tıkla</div>
                        `;
                        div.onclick = () => openPlayer(match.channelUrl);
                        matchGrid.appendChild(div);
                    });
                }, 1000);

            } catch (error) {
                console.error("Maçlar yüklenirken hata:", error);
                loading.innerText = "Maçlar yüklenirken bir hata oluştu.";
            }
        }

        // Player Modalını Aç ve Reklamı Gizle
        function openPlayer(url) {
            const modal = document.getElementById('player-modal');
            const iframe = document.getElementById('player-frame');
            
            // URL'i ayarla
            iframe.src = url;
            modal.style.display = 'flex';

            // Reklam gizleme işlemi (Iframe yüklendikten sonra)
            iframe.onload = function() {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    // Bet reklamlarını ve gereksiz elementleri gizle
                    const styles = `
                        <style>
                            .banner, .ad, .advertisement, .promo, .bet-banner, 
                            [class*="reklam"], [id*="reklam"], [class*="bet"], 
                            .modal-overlay, .pop-up { 
                                display: none !important; 
                                visibility: hidden !important; 
                            }
                        </style>
                    `;
                    if(iframeDoc.head) {
                        iframeDoc.head.insertAdjacentHTML('beforeend', styles);
                    }
                } catch (e) {
                    console.log("Cross-origin policy nedeniyle iframe içine müdahale edilemedi.", e);
                }
            };
        }

        function closePlayer() {
            const modal = document.getElementById('player-modal');
            const iframe = document.getElementById('player-frame');
            iframe.src = "";
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
