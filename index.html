<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetbetTV - Canlı Maç İzle</title>
    <style>
        :root {
            --primary-color: #00ff88;
            --secondary-color: #00ccff;
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* NEON LOGO EFEKTİ */
        .logo-container {
            margin-top: 30px;
            margin-bottom: 20px;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--primary-color),
                0 0 40px var(--primary-color),
                0 0 80px var(--primary-color);
            animation: neon-pulse 1.5s infinite alternate;
            letter-spacing: 2px;
        }

        @keyframes neon-pulse {
            0% {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 20px var(--primary-color),
                    0 0 40px var(--primary-color),
                    0 0 80px var(--primary-color);
                opacity: 1;
            }
            100% {
                text-shadow: 
                    0 0 2px #fff,
                    0 0 5px #fff,
                    0 0 10px var(--primary-color),
                    0 0 20px var(--primary-color),
                    0 0 40px var(--primary-color);
                opacity: 0.9;
            }
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #ff0055, #ff5500);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
        }

        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.5);
        }

        #matchList {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        .match-item {
            background-color: var(--card-bg);
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary-color);
            cursor: pointer;
            transition: background 0.3s;
        }

        .match-item:hover {
            background-color: #252530;
        }

        .match-info {
            text-align: left;
            flex-grow: 1;
        }

        .match-time {
            color: var(--secondary-color);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .match-teams {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 5px;
        }

        .match-channel {
            background: rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
        }

        /* Iframe Modal */
        #playerModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #playerContainer {
            width: 90%;
            max-width: 1000px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 1001;
        }

        /* Puan Durumu Tablosu */
        #standingsModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        #standingsContent {
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--primary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: white;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: rgba(0, 255, 136, 0.2);
            color: var(--primary-color);
        }

        /* Reklam Gizleme */
        iframe {
            pointer-events: auto;
        }
        /* Bet reklamlarını gizlemek için iframe içine müdahale edemeyiz ama çerçeveyi temiz tutuyoruz */
        
        .loading {
            color: var(--secondary-color);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="logo">NETBET TV</div>
    </div>

    <div class="container">
        <!-- Gereksiz yazılar kaldırıldı -->
        
        <button class="btn" onclick="loadMatches()">📅 Günün Maçları</button>
        <button class="btn btn-secondary" onclick="toggleStandings()">📊 Puan Durumu</button>

        <ul id="matchList">
            <li class="loading">Maçları yüklemek için "Günün Maçları" butonuna tıklayın.</li>
        </ul>
    </div>

    <!-- Oyuncu Modal -->
    <div id="playerModal">
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        <div id="playerContainer">
            <iframe id="streamFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Puan Durumu Modal -->
    <div id="standingsModal">
        <span class="close-btn" onclick="toggleStandings()">&times;</span>
        <div id="standingsContent">
            <h2 style="text-align:center; color: var(--primary-color);">Süper Lig Puan Durumu</h2>
            <div id="standingsTableContainer">Yükleniyor...</div>
        </div>
    </div>

    <script>
        // Fixbettv84 verilerini simüle eden yapı (Gerçek site yapısına göre ayarlanmalı)
        // Not: Gerçek bir siteden veri çekmek için CORS proxy veya backend gerekir.
        // Burada kullanıcı deneyimi için örnek veri yapısı ve mantık kurulmuştur.
        
        const matchData = [
            { time: "14:00", home: "Galatasaray", away: "Fenerbahçe", channel: "beIN Sports 1", url: "https://fixbettv84.com/embed/channel1" },
            { time: "17:00", home: "Trabzonspor", away: "Beşiktaş", channel: "beIN Sports 2", url: "https://fixbettv84.com/embed/channel2" },
            { time: "20:00", home: "Hazırlık Maçı", away: "Örnek Takım A", channel: "Fanatik TV", url: "https://fixbettv84.com/embed/friendly" },
            { time: "21:45", home: "Real Madrid", away: "Barcelona", channel: "beIN Sports 3", url: "https://fixbettv84.com/embed/laliga" }
        ];

        function loadMatches() {
            const list = document.getElementById('matchList');
            list.innerHTML = '<li class="loading">Maçlar yükleniyor...</li>';

            // Gerçek senaryoda burada fetch ile fixbettv84.com analiz edilirdi.
            // Şimdilik demo veri ile çalışıyoruz.
            setTimeout(() => {
                list.innerHTML = '';
                matchData.forEach(match => {
                    const li = document.createElement('li');
                    li.className = 'match-item';
                    li.onclick = () => openPlayer(match.url);
                    li.innerHTML = `
                        <div class="match-info">
                            <div class="match-time">⏰ ${match.time} - ${match.channel}</div>
                            <div class="match-teams">${match.home} vs ${match.away}</div>
                        </div>
                        <div class="match-channel">▶️ İzle</div>
                    `;
                    list.appendChild(li);
                });
            }, 800);
        }

        function openPlayer(url) {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('streamFrame');
            iframe.src = url;
            modal.style.display = 'flex';
            
            // Reklam engelleme simülasyonu (iframe yüklendikten sonra CSS injection gerekebilir ama cross-origin kısıtlaması vardır)
            // Kullanıcıya daha temiz bir deneyim sunmak için iframe etrafına siyah çerçeve koyduk.
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('streamFrame');
            iframe.src = '';
            modal.style.display = 'none';
        }

        async function toggleStandings() {
            const modal = document.getElementById('standingsModal');
            const container = document.getElementById('standingsTableContainer');
            
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
                return;
            }

            modal.style.display = 'flex';
            container.innerHTML = 'Puan durumu yükleniyor...';

            try {
                // TFF veya benzeri bir kaynaktan veri çekme simülasyonu
                // Gerçek API olmadığı için statik örnek tablo oluşturuyoruz
                await new Promise(r => setTimeout(r, 1000));
                
                const standings = [
                    { rank: 1, team: "Galatasaray", p: 10, w: 9, d: 1, l: 0, pts: 28 },
                    { rank: 2, team: "Fenerbahçe", p: 10, w: 8, d: 2, l: 0, pts: 26 },
                    { rank: 3, team: "Beşiktaş", p: 10, w: 6, d: 1, l: 3, pts: 19 },
                    { rank: 4, team: "Trabzonspor", p: 10, w: 5, d: 2, l: 3, pts: 17 },
                    { rank: 5, team: "Samsunspor", p: 10, w: 4, d: 3, l: 3, pts: 15 }
                ];

                let html = `<table>
                    <thead>
                        <tr>
                            <th>#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>P</th>
                        </tr>
                    </thead>
                    <tbody>`;
                
                standings.forEach(row => {
                    html += `<tr>
                        <td>${row.rank}</td>
                        <td style="font-weight:bold;">${row.team}</td>
                        <td>${row.p}</td>
                        <td>${row.w}</td>
                        <td>${row.d}</td>
                        <td>${row.l}</td>
                        <td style="color:var(--primary-color); font-weight:bold;">${row.pts}</td>
                    </tr>`;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = 'Puan durumu yüklenirken hata oluştu.';
                console.error(error);
            }
        }
    </script>
</body>
</html>
