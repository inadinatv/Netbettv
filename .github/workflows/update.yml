# ============================================================
# Otomatik Güncelleme
# Yayın sitesinin maç listesi kaynağından (data-reality.com/matches2.php)
# günün maçlarını çeker, matches.json'u günceller, domaini tazeler.
# ============================================================
name: Otomatik Güncelleme

on:
  schedule:
    - cron: "*/15 * * * *" # 15 dakikada bir
  workflow_dispatch:        # elle tetikleme imkânı
  push:
    branches: [main]        # ana dala push olunca da hemen güncelle

permissions:
  contents: write

concurrency:
  group: netbettv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Botu çalıştır (domain + maçlar)
        run: python bot.py --once

      - name: Değişiklikleri commit'le ve push et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html matches.json config.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok — commit atlanıyor."
          else
            git commit -m "chore: otomatik guncelleme - mac listesi ve domain [skip ci]"
            git push
          fi
