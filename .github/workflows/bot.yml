name: Bot Otomatik Güncelleme

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        run: pip install cloudscraper beautifulsoup4

      - name: Botu çalıştır
        run: RUN_ONCE=1 python bot.py

      - name: Değişiklikleri yükle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json index.html
          git diff --staged --quiet || (git commit -m "🤖 Maç verileri güncellendi" && git push)
